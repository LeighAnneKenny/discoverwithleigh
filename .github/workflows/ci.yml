name: CI

on:
  push:
    branches: [main, 'topic/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # API suite — runs inside workerd, no credentials needed
      - run: npm test

      # UI suite — Playwright boots build + wrangler dev (local mode) itself,
      # but the local D1/R2 must carry the schema and seed content first
      - run: npx playwright install --with-deps chromium webkit
      - name: Migrate and seed local D1/R2
        run: |
          for f in migrations/*.sql; do
            npx wrangler d1 execute discoverwithleigh --local --file "$f"
          done
          node scripts/seed.ts
          # contact PII is blanked in source (PRD item 9); give CI dummy values
          # so rendering paths (FAB href, footer mailto, JSON-LD) are exercised
          npx wrangler d1 execute discoverwithleigh --local --command "UPDATE content SET value = json_set(value, '\$.phone', '+1 555 010 0000', '\$.phoneHref', 'tel:+15550100000', '\$.email', 'ci@example.invalid') WHERE key = 'contact'"
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: e2e-artifacts/
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
